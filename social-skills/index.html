<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>和喬治一起練習相處</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <style>
    :root {
      /* 共用色彩：奶油米色、鼠尾草綠、柔和天空藍、木質棕、暖黃色；磚紅／橘色只當重點色 */
      --bg: #5f9ea0; --surface: #FBF7EE; --ink: #4A3B33; --ink-soft: #7A6A60; --line: #E2D6C3; --muted: #EFE7DA;
      --red: #C0634D; --red-soft: #F6E3DC; --yellow: #C99A3E; --yellow-soft: #F8EED6; --green: #5F8466; --green-soft: #E2ECDF; --teal: #AFEEEE; --teal-ink: #1F5F5F;
      --brand: #C47A4E; --radius: 18px; --tap: 50px;
      --font: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { font-size: clamp(16px, 1.3vw, 19px); line-height: 1.6; -webkit-text-size-adjust: 100%; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; opacity: .45; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 16px 16px 60px; }

    /* 上方選單 */
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .top h1 { flex: 1; margin: 0; font-size: 1.35em; display: flex; align-items: center; gap: 10px; min-width: 220px; }
    .lights { display: inline-flex; gap: 4px; background: #333; padding: 5px 7px; border-radius: 999px; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .tabs { display: flex; gap: 6px; }
    .tab { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); }
    .tab[aria-current="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* 情境列表 */
    .intro { background: var(--surface); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; display: flex; gap: 14px; align-items: center; }
    .intro .face { font-size: 44px; line-height: 1; flex: none; }
    .intro .face img { width: 76px; height: 76px; object-fit: contain; display: block; }
    .intro p { margin: 0; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .sc-card { text-align: left; border: 3px solid var(--line); border-top: 10px solid var(--teal); background: var(--surface); border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .12s; }
    .sc-card:hover { border-color: var(--brand); border-top-color: var(--teal); transform: translateY(-2px); }
    .sc-card .no { font-size: .8em; color: var(--brand); font-weight: 700; display: flex; gap: 10px; }
    .sc-card h3 { margin: 0; font-size: 1.2em; }
    .sc-card p { margin: 0; color: var(--ink-soft); font-size: .9em; }
    .stars { color: var(--yellow); letter-spacing: 2px; }
    .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .chain .c { background: var(--teal); color: var(--teal-ink); border-radius: 999px; padding: 2px 12px; font-weight: 700; }
    .chain .ar { color: var(--ink-soft); }
    .chain.small { font-size: .8em; margin-top: 4px; }
    .chain.big { font-size: 1.25em; gap: 10px; }
    .chain.big .c { padding: 6px 18px; }

    /* 播放器 */
    .bar2 { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .bar2 h2 { margin: 0; font-size: 1.3em; flex: 1; }
    .btn { min-height: var(--tap); padding: 0 18px; border-radius: 12px 15px 12px 14px / 14px 12px 15px 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700;
      box-shadow: 0 2px 0 rgba(91, 74, 66, .14); transition: transform .15s ease, box-shadow .15s ease; }
    .btn:hover:not(:disabled) { border-color: var(--ink-soft); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(91, 74, 66, .14); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.go { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.sm { min-height: 40px; padding: 0 12px; font-size: .85em; font-weight: 400; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .spacer { flex: 1; }

    .steps { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .steps button { width: 100%; min-height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 4px; line-height: 1.25; font-size: .85em; }
    .steps b { display: block; font-size: 1.15em; }
    .steps .done { background: var(--muted); }
    .steps [aria-current="step"] { border-color: var(--ink); background: var(--ink); color: #fff; }

    /* ===== 舞台（繪本場景） ===== */
    .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #EFE6D6;
      box-shadow: 0 10px 28px rgba(30, 42, 42, .28), 0 0 0 1px rgba(91, 74, 66, .12); isolation: isolate; container-type: inline-size; }
    .stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* 紙張紋理與柔和暗角 */
    .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: .3; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .24  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(84, 60, 40, .2) 100%); }

    /* 左上：手繪紙標籤 */
    .tag { position: absolute; top: 12px; left: 14px; z-index: 3; padding: 3px 14px 4px 24px; font-size: clamp(9px, 1.6vw, 15px); font-size: clamp(9px, 1.55cqw, 15px); color: var(--ink);
      background: #FBF6EA; border: 1px solid rgba(91, 74, 66, .22); border-radius: 3px 12px 12px 3px / 3px 14px 10px 3px;
      box-shadow: 0 2px 6px rgba(80, 58, 40, .16); transform: rotate(-1.5deg); transition: transform .2s ease, box-shadow .2s ease; }
    .tag::before { content: ""; position: absolute; left: 8px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%;
      background: #E9DFCD; box-shadow: inset 0 1px 1px rgba(80, 58, 40, .35); }
    .tag::after { content: ""; position: absolute; left: -12px; top: 50%; width: 22px; height: 1.5px; background: #A98F74; transform: rotate(-24deg); transform-origin: right center; }
    .tag:hover { transform: rotate(-1.5deg) translateY(-2px); box-shadow: 0 5px 10px rgba(80, 58, 40, .2); }
    .tag.red { border-left: 5px solid #C8664F; } .tag.green { border-left: 5px solid #7FA07A; } .tag.yellow { border-left: 5px solid #D9B25F; }
    .count { position: absolute; bottom: 10px; right: 14px; z-index: 3; font-size: clamp(8px, 1.3cqw, 13px); color: var(--ink-soft); background: rgba(251, 246, 234, .85);
      padding: 0 10px; border-radius: 3px 8px 6px 4px; transform: rotate(1.5deg); }

    /* 上方：故事旁白卡（紙張＋紙膠帶） */
    .cap { position: absolute; left: 50%; top: 7%; z-index: 3; width: max-content; max-width: 66%; transform: translateX(-50%) rotate(-.6deg);
      background: #FBF6EA; color: #5B4A42; padding: .5em 1.3em .55em; border-radius: 3px 8px 5px 6px; text-align: center;
      font-size: clamp(9px, 2vw, 19px); font-size: clamp(9px, 1.95cqw, 19px); line-height: 1.45; box-shadow: 0 4px 12px rgba(80, 58, 40, .2), 0 1px 0 rgba(255, 255, 255, .7) inset;
      animation: capIn .45s ease both; }
    .cap::before { content: ""; position: absolute; top: -9px; left: 50%; width: 62px; height: 17px; margin-left: -31px; background: rgba(157, 181, 154, .62);
      transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(80, 58, 40, .12); }
    @keyframes capIn { from { opacity: 0; transform: translateX(-50%) translateY(-6px) rotate(-.6deg); } to { opacity: 1; transform: translateX(-50%) rotate(-.6deg); } }

    /* 對話框：繪本式半透明紙張 */
    .bub { position: absolute; z-index: 3; max-width: 36%; padding: .38em .9em .45em; color: #4A3B33; font-size: clamp(9px, 2.05vw, 20px); font-size: clamp(9px, 2.05cqw, 20px); line-height: 1.4;
      background: rgba(251, 247, 238, .95); border: 1.5px solid rgba(91, 74, 66, .28); border-radius: 18px 22px 20px 16px / 18px 16px 22px 20px;
      box-shadow: 0 5px 14px rgba(80, 58, 40, .17); animation: bubIn .42s ease both; }
    .bub::after { content: ""; position: absolute; bottom: -8px; left: var(--tail, 28px); width: 14px; height: 14px; background: rgba(251, 247, 238, .95);
      border-right: 1.5px solid rgba(91, 74, 66, .28); border-bottom: 1.5px solid rgba(91, 74, 66, .28); transform: rotate(45deg); border-radius: 0 0 4px 0; }
    .bub.think { background: rgba(255, 253, 248, .8); border-style: dashed; color: #6B5A50; border-radius: 26px 30px 28px 24px; }
    .bub.think::after { width: 11px; height: 11px; border-radius: 50%; bottom: -15px; transform: none; border: 1.5px dashed rgba(91, 74, 66, .3); background: rgba(255, 253, 248, .85); }
    .bub .who { display: block; font-size: .62em; color: #8A786C; letter-spacing: .05em; }
    @keyframes bubIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .fx { position: absolute; z-index: 3; width: clamp(34px, 7%, 70px); transform: translate(-50%, -50%); animation: fxIn .45s ease both; }
    .fx svg { width: 100%; display: block; }
    @keyframes fxIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    .stamp { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .stamp svg { width: 34%; overflow: visible; }
    .stamp .brush { fill: none; stroke-width: 7; stroke-linecap: round; opacity: .88; stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw .55s ease forwards; }
    .stamp .brush.b2 { animation-delay: .22s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* 人物：走路、轉身、跌倒都用柔和的轉場 */
    .ch { transition: transform 1s cubic-bezier(.45, .05, .35, 1), opacity .5s ease; }
    .ch .rot { transition: transform .45s ease; }
    .ch .fl { transition: transform .34s ease; }
    .no-tr .ch, .no-tr .ch .rot, .no-tr .ch .fl { transition: none !important; }
    .walk .wk { animation: bob .26s ease-in-out 4 alternate; }
    @keyframes bob { to { transform: translateY(-1.8px); } }
    /* 待機：呼吸、眨眼（很小，不彈跳） */
    .br { animation: breathe 4.4s ease-in-out infinite; animation-delay: var(--bd, 0s); }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.8s infinite; animation-delay: var(--bd, 0s); }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
    /* 說話：頭微微轉向對方、嘴巴開合 */
    .talk-m { opacity: 0; }
    .talk .talk-m { animation: talkm .34s steps(2, end) infinite; }
    @keyframes talkm { 0% { opacity: 0; } 50% { opacity: .95; } }
    .talk .head { animation: nod 1.5s ease-in-out infinite alternate; }
    @keyframes nod { from { transform: rotate(-1.2deg); } to { transform: rotate(1.6deg); } }
    /* 緊張：身體稍微縮起來、很小的不安動作 */
    .nervous .nv { animation: fidget 2.6s ease-in-out infinite; }
    @keyframes fidget { 0%, 100% { transform: scaleY(.975) translateX(0); } 50% { transform: scaleY(.972) translateX(.7px); } }
    /* 場景：光線、葉子、浮塵、慢慢的視差 */
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite alternate; }
    .sway.slow { animation-duration: 9s; }
    @keyframes sway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
    .swing { transform-box: fill-box; transform-origin: 50% 0; animation: swing 7s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
    .beam { animation: beam 10s ease-in-out infinite alternate; }
    .beam.slow { animation-duration: 14s; }
    @keyframes beam { from { opacity: .45; } to { opacity: .85; } }
    .dust { animation: dust 13s linear infinite; }
    @keyframes dust { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .85; } 85% { opacity: .6; } 100% { transform: translate(14px, -24px); opacity: 0; } }
    .L-bg { transform-origin: 400px 225px; animation: drift 28s ease-in-out infinite alternate; }
    .L-fg { transform-origin: 400px 225px; animation: driftF 28s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-2.5px) scale(1.012); } to { transform: translateX(2.5px) scale(1.012); } }
    @keyframes driftF { from { transform: translateX(3px) scale(1.016); } to { transform: translateX(-3px) scale(1.016); } }
    .prop { animation: inFade .35s ease both; }
    /* 進場：背景 → 景深中的家具 → 人物依序 → 旁白卡與互動元素（約 1.2 秒） */
    @keyframes inFade { from { opacity: 0; } to { opacity: 1; } }
    .enter .L-bg { animation: inFade .45s ease both, drift 28s ease-in-out infinite alternate; }
    .enter .L-mid { animation: inFade .45s .15s ease both; }
    .enter .L-fg { animation: inFade .45s .25s ease both, driftF 28s ease-in-out infinite alternate; }
    .enter .ch .in { animation: inFade .45s ease both; animation-delay: calc(.4s + var(--i) * .1s); }
    .enter .L-props, .enter .L-light { animation: inFade .4s .7s ease both; }
    .enter .cap { animation: capIn .4s .85s ease both; }
    .enter .bub { animation: bubIn .4s .95s ease both; }
    .enter .tag, .enter .count { animation: inFade .4s .85s ease both; }
    .swap .L-chars, .swap .L-props { animation: inFade .35s ease both; }
    @media (prefers-reduced-motion: reduce) {
      .stage *, .stage *::before, .stage *::after { animation: none !important; transition: none !important; }
    }

    .ctrl { margin: 10px 0 14px; }
    .panel { background: var(--surface); border-radius: var(--radius); padding: 18px; border-left: 10px solid var(--line); box-shadow: 0 6px 18px rgba(30, 42, 42, .16); }
    .panel.red { border-color: var(--red); } .panel.yellow { border-color: var(--yellow); } .panel.green { border-color: var(--green); }
    .panel h3 { margin: 0 0 8px; font-size: 1.3em; display: flex; align-items: center; gap: 10px; }
    .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-block; flex: none; }
    .lead { margin: 0 0 12px; color: var(--ink-soft); }
    .on-bg { color: #fff !important; }
    .say { min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); flex: none; font-size: 1.05em; }
    .say:hover { border-color: var(--brand); }
    .say.corner { position: absolute; top: 10px; right: 10px; }
    .sc-wrap, .kcard { position: relative; }
    .sc-wrap { display: flex; }
    .sc-wrap .sc-card { flex: 1; padding-right: 64px; }
    .opt-row, .practice li, .hint, .three h4 { display: flex; gap: 8px; align-items: center; }
    .opt-row .opt, .practice li button:not(.say) { flex: 1; }
    .three h4 span { flex: 1; }
    .hint span { flex: 1; }
    .twist { display: flex; gap: 10px; align-items: center; }
    .twist div { flex: 1; }
    .qs { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 10px; }
    .q { background: var(--red-soft); border-radius: 14px; padding: 10px 14px; }
    .q .qrow { display: flex; gap: 10px; align-items: center; font-weight: 700; }
    .q .num { width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .q .txt { flex: 1; }
    .hint { margin: 8px 0 0 40px; background: #fff; border-radius: 10px; padding: 4px 6px 4px 12px; }
    .hintbtn { margin: 8px 0 0 40px; border: 2px dashed var(--red); background: #fff; border-radius: 10px; padding: 4px 14px; color: var(--red); }
    .opts { display: grid; gap: 10px; margin-bottom: 12px; }
    .opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 3px solid var(--line); background: var(--yellow-soft); border-radius: 16px; padding: 10px 14px; min-height: 64px; font-size: 1.1em; }
    .opt:hover:not(:disabled) { border-color: var(--yellow); }
    .opt .ic { font-size: 1.6em; }
    .opt.ok { border-color: var(--green); background: var(--green-soft); }
    .opt.no { border-color: var(--red); background: var(--red-soft); }
    .fb { border-radius: 12px; padding: 8px 14px; margin: 0 0 12px; font-weight: 700; }
    .fb.ok { background: var(--green-soft); color: var(--green); } .fb.no { background: var(--red-soft); color: var(--red); }
    .note { color: var(--ink-soft); font-size: .9em; margin: 0 0 12px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .three div { border-radius: 14px; padding: 10px 14px; }
    .three h4 { margin: 0 0 4px; }
    .three p { margin: 0; }
    .b1 { background: var(--red-soft); } .b2 { background: var(--yellow-soft); } .b3 { background: var(--green-soft); }
    .practice { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
    .practice button:not(.say) { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 14px; min-height: 56px; }
    .practice .box { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--green); flex: none; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
    .practice .on { border-color: var(--green); background: var(--green-soft); }
    .practice .on .box { background: var(--green); }
    .twist { background: var(--yellow-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
    .rate { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .rate button { border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 6px 16px; min-height: 52px; }
    .rate button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); font-weight: 700; }

    /* 口訣卡 */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .kcard { background: var(--surface); border-radius: var(--radius); padding: 16px; border-top: 10px solid var(--teal); break-inside: avoid; }
    .kcard .no { color: var(--ink-soft); font-size: .85em; }
    .kcard h3 { margin: 2px 0 10px; }
    .kcard p { margin: 10px 0 0; }

    @media (max-width: 640px) {
      .steps { grid-template-columns: repeat(5, 1fr); gap: 3px; }
      .steps button { font-size: .72em; min-height: 46px; }
      .steps span { display: none; }
      .three { grid-template-columns: 1fr; }
      .bub { max-width: 44%; }
    }
    /* 列印教材 */
    .printbar { background: var(--surface); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .printbar select { font: inherit; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); padding: 0 10px; background: #fff; }
    .pg { background: #fff; border-radius: 18px; padding: 28px 32px; margin-bottom: 18px; color: #222; font-size: 18px; }
    .pg-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 4px solid var(--teal); padding-bottom: 8px; margin-bottom: 14px; }
    .pg-head .n { color: var(--teal-ink); font-weight: 700; white-space: nowrap; }
    .pg-head h2 { margin: 0; font-size: 1.6em; }
    .pg-head .kind { margin-left: auto; font-weight: 700; white-space: nowrap; }
    .pg-meta { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-bottom: 14px; }
    .pg-meta i { display: inline-block; width: 150px; border-bottom: 2px solid #333; }
    .pg-meta i.s { width: 50px; }
    .pg-pic { width: 100%; max-width: 520px; aspect-ratio: 16 / 9; display: block; margin: 0 auto 14px; border-radius: 12px; overflow: hidden; border: 2px solid #ddd; }
    .pg-pic svg { width: 100%; height: 100%; display: block; }
    .pg h3 { font-size: 1.15em; margin: 18px 0 8px; }
    .pg .wl { border-bottom: 2px dashed #999; height: 40px; }
    .pg .qopts { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .pg .qopts li::before { content: "○"; font-size: 1.3em; margin-right: 10px; }

  if (pk === null) fb = '<p class="note">先讓學生說說看，再按選項。選錯的話，畫面會演出「這樣做會發生什麼事」。每個選項旁邊的 🔊 可以念出選項。</p>';
  else if (c.opts[pk].ok) fb = '<p class="fb ok row"><span style="flex:1">⭐ ' + esc(c.opts[pk].fb) + '</span>' + sayBtn(c.opts[pk].fb) + '</p><div class="row"><span class="spacer"></span><button class="btn go" id="go">▶ 看喬治換個方式做</button></div>';
  else fb = '<p class="fb no row"><span style="flex:1">' + esc(c.opts[pk].fb) + '</span>' + sayBtn(c.opts[pk].fb) + '</p><div class="row"><span class="spacer"></span><button class="btn primary" id="again">再選一次</button></div>';
  p.innerHTML = '<h3><span class="dot" style="background:var(--yellow)"></span><span style="flex:1">' + esc(c.q) + '</span>' + sayBtn(c.q) + '</h3>' +
    '<div class="opts">' + c.opts.map(function (o, i) {
      return '<div class="opt-row"><button class="opt ' + (pk === i ? (o.ok ? 'ok' : 'no') : '') + '" data-i="' + i + '" data-label="' + esc(o.t) + '"><span class="ic">' + o.ic + '</span><span>' + esc(o.t) + '</span></button>' + sayBtn(o.t) + '</div>';
    }).join('') + '</div>' + fb;
  p.querySelectorAll('.opt').forEach(function (b) {
    b.onclick = function () {
      var i = +b.dataset.i, o = c.opts[i]; state.picked = i;
      if (o.ok) { showFrames(s.wrong.slice(0, 1), ['想一想', 'yellow']); state.stamp = '⭕'; drawFrame(state.badge); renderChoose(); speak(o.fb); }
      else { showFrames(o.demo, ['如果這樣做…', 'red']); renderChoose(); autoPlayThen(function () { state.stamp = '❌'; drawFrame(state.badge); speak(o.fb); }); }
    };
  });
  if ($('#go')) $('#go').onclick = function () { goPhase('right'); };
  if ($('#again')) $('#again').onclick = function () { state.picked = null; showFrames(s.wrong.slice(0, 1), ['想一想', 'yellow']); renderChoose(); };
}
function autoPlayThen(cb) {
  autoPlay();
  var run = state.auto;
  (function wait() { if (state.auto === run) setTimeout(wait, 300); else if (state.fi === state.frames.length - 1) cb(); })();
}

function renderAct() {
  var s = SCENES[state.sc], p = $('#panel'), r = state.rate[s.id] || 0;
  p.className = 'panel green';
  p.innerHTML = '<h3><span class="dot" style="background:var(--green)"></span><span style="flex:1">我可以怎麼做</span>' + sayBtn('我可以怎麼做：' + s.how.chain.join('，') + '。' + s.how.note) + '</h3>' + chain(s.how.chain, 'big') +
    '<p class="lead" style="margin-top:10px">' + esc(s.how.note) + '</p>' +
    '<div class="three">' + [['b1', '🔴', '發生什麼問題', s.sum.p], ['b2', '🟡', '別人心裡想什麼', s.sum.o], ['b3', '🟢', '我重新選擇', s.sum.c]].map(function (x) {
      return '<div class="' + x[0] + '"><h4><span>' + x[1] + ' ' + x[2] + '</span>' + sayBtn(x[2] + '：' + x[3]) + '</h4><p>' + esc(x[3]) + '</p></div>';
    }).join('') + '</div>' +
    '<h3 style="font-size:1.15em"><span style="flex:1">🎭 換我演：做到一步，就按一下</span>' + sayBtn('換我演：做到一步，就按一下') + '</h3><ol class="practice">' + s.practice.map(function (t, i) {
      return '<li><button class="' + (state.checks[i] ? 'on' : '') + '" data-i="' + i + '"><span class="box">' + (state.checks[i] ? '✓' : '') + '</span>' + (i + 1) + '. ' + esc(t) + '</button>' + sayBtn('第' + (i + 1) + '步，' + t) + '</li>';
    }).join('') + '</ol>' +
    '<div class="twist"><div><b>🤔 ' + esc(s.twist.q) + '</b><br>→ ' + esc(s.twist.a) + '</div>' + sayBtn(s.twist.q + s.twist.a) + '</div>' +
    '<h3 style="font-size:1.15em"><span style="flex:1">⭐ 我這次演得怎麼樣？</span>' + sayBtn('我這次演得怎麼樣？做到了、差一點，還是還要練？') + '</h3><div class="rate">' +
    [[3, '😀 做到了'], [2, '🙂 差一點'], [1, '😟 還要練']].map(function (x) { return '<button data-r="' + x[0] + '" aria-pressed="' + (r === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="again">再看一次喬治怎麼做</button><span class="spacer"></span>' +
    (state.sc < SCENES.length - 1 ? '<button class="btn go" id="nextsc">下一個情境 →</button>' : '<button class="btn go" id="cards">看全部口訣卡 →</button>') + '</div>';
  p.querySelectorAll('.practice button').forEach(function (b) {
    b.onclick = function () { var i = b.dataset.i; state.checks[i] = !state.checks[i]; if (state.checks[i]) speak(s.practice[i]); renderAct(); };
  });
  p.querySelectorAll('.rate button').forEach(function (b) {
    b.onclick = function () { state.rate[s.id] = +b.dataset.r; storeChecks(); renderAct(); speak(b.textContent.replace(/^\S+\s/, '')); };
  });
  $('#again').onclick = function () { goPhase('wrong'); };
  if ($('#nextsc')) $('#nextsc').onclick = function () { openScene(state.sc + 1); };
  if ($('#cards')) $('#cards').onclick = function () { stopAll(); state.view = 'cards'; render(); };
}

document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { stopAll(); state.view = b.dataset.view; render(); }; });
render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>和喬治一起練習相處</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #fff0f5; --surface: #FFFFFF; --ink: #2B2A28; --ink-soft: #6B6760; --line: #E4DCCB; --muted: #ECE6DA;
      --red: #D2483C; --red-soft: #FCE6E3; --yellow: #E0A21A; --yellow-soft: #FDF2D6; --green: #2D8A57; --green-soft: #DDF2E5;
      --brand: #E07A2E; --radius: 20px; --tap: 50px;
      --font: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { font-size: clamp(16px, 1.3vw, 19px); line-height: 1.6; -webkit-text-size-adjust: 100%; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; opacity: .45; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 16px 16px 60px; }

    /* 上方選單 */
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .top h1 { flex: 1; margin: 0; font-size: 1.35em; display: flex; align-items: center; gap: 10px; min-width: 220px; }
    .lights { display: inline-flex; gap: 4px; background: #333; padding: 5px 7px; border-radius: 999px; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .tabs { display: flex; gap: 6px; }
    .tab { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); }
    .tab[aria-current="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* 情境列表 */
    .intro { background: var(--surface); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; display: flex; gap: 14px; align-items: center; }
    .intro .face { font-size: 44px; line-height: 1; flex: none; }
    .intro .face img { width: 76px; height: 76px; object-fit: contain; display: block; }
    .intro p { margin: 0; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .sc-card { text-align: left; border: 3px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .12s; }
    .sc-card:hover { border-color: var(--brand); transform: translateY(-2px); }
    .sc-card .no { font-size: .8em; color: var(--brand); font-weight: 700; display: flex; gap: 10px; }
    .sc-card h3 { margin: 0; font-size: 1.2em; }
    .sc-card p { margin: 0; color: var(--ink-soft); font-size: .9em; }
    .stars { color: var(--yellow); letter-spacing: 2px; }
    .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .chain .c { background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 2px 12px; font-weight: 700; }
    .chain .ar { color: var(--ink-soft); }
    .chain.small { font-size: .8em; margin-top: 4px; }
    .chain.big { font-size: 1.25em; gap: 10px; }
    .chain.big .c { padding: 6px 18px; }

    /* 播放器 */
    .bar2 { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .bar2 h2 { margin: 0; font-size: 1.3em; flex: 1; }
    .btn { min-height: var(--tap); padding: 0 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
    .btn:hover:not(:disabled) { border-color: var(--ink-soft); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.go { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.sm { min-height: 40px; padding: 0 12px; font-size: .85em; font-weight: 400; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .spacer { flex: 1; }

    .steps { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .steps button { width: 100%; min-height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 4px; line-height: 1.25; font-size: .85em; }
    .steps b { display: block; font-size: 1.15em; }
    .steps .done { background: var(--muted); }
    .steps [aria-current="step"] { border-color: var(--ink); background: var(--ink); color: #fff; }

    .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: #eee; border: 3px solid var(--line); }
    .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .badge { position: absolute; top: 10px; left: 10px; padding: 2px 14px; border-radius: 999px; color: #fff; font-weight: 700; font-size: .9em; z-index: 3; }
    .badge.red { background: var(--red); } .badge.green { background: var(--green); } .badge.yellow { background: var(--yellow); }
    .count { position: absolute; top: 10px; right: 12px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 0 12px; font-size: .85em; z-index: 3; }
    .bub { position: absolute; z-index: 2; max-width: 38%; padding: .35em .75em; background: #fff; border: 3px solid var(--ink); border-radius: 18px;
      font-size: clamp(13px, 2.3vw, 22px); line-height: 1.35; font-weight: 700; animation: pop .25s ease-out; }
    .bub::after { content: ""; position: absolute; bottom: -12px; left: var(--tail, 30px); border: 8px solid transparent; border-top: 9px solid var(--ink); }
    .bub.think { border-style: dashed; border-color: #8a8a8a; background: #f7f7ff; font-weight: 400; color: #444; border-radius: 26px; }
    .bub.think::after { border: 0; width: 10px; height: 10px; border-radius: 50%; background: #f7f7ff; border: 2px dashed #8a8a8a; bottom: -16px; }
    .bub .who { display: block; font-size: .65em; font-weight: 400; color: var(--ink-soft); }
    .cap { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); width: max-content; max-width: 70%; z-index: 2; background: rgba(43,42,40,.85); color: #fff;
      padding: .3em 1.1em; border-radius: 999px; font-size: clamp(13px, 2.1vw, 20px); text-align: center; }
    .fx { position: absolute; z-index: 2; font-size: clamp(26px, 6vw, 58px); transform: translate(-50%, -50%); animation: pop .3s ease-out; }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .fx { animation: fxpop .35s ease-out; } @keyframes fxpop { from { transform: translate(-50%,-50%) scale(.3); } to { transform: translate(-50%,-50%) scale(1); } }
    .ch { transition: transform .5s ease; }
    .stamp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; pointer-events: none; }
    .stamp span { font-size: clamp(60px, 16vw, 150px); filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); animation: pop .3s ease-out; }

    .ctrl { margin: 10px 0 14px; }
    .panel { background: var(--surface); border-radius: var(--radius); padding: 18px; border-left: 10px solid var(--line); }
    .panel.red { border-color: var(--red); } .panel.yellow { border-color: var(--yellow); } .panel.green { border-color: var(--green); }
    .panel h3 { margin: 0 0 8px; font-size: 1.3em; display: flex; align-items: center; gap: 10px; }
    .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-block; flex: none; }
    .lead { margin: 0 0 12px; color: var(--ink-soft); }
    .say { min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); flex: none; font-size: 1.05em; }
    .say:hover { border-color: var(--brand); }
    .say.corner { position: absolute; top: 10px; right: 10px; }
    .sc-wrap, .kcard { position: relative; }
    .sc-wrap { display: flex; }
    .sc-wrap .sc-card { flex: 1; padding-right: 64px; }
    .opt-row, .practice li, .hint, .three h4 { display: flex; gap: 8px; align-items: center; }
    .opt-row .opt, .practice li button:not(.say) { flex: 1; }
    .three h4 span { flex: 1; }
    .hint span { flex: 1; }
    .twist { display: flex; gap: 10px; align-items: center; }
    .twist div { flex: 1; }
    .qs { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 10px; }
    .q { background: var(--red-soft); border-radius: 14px; padding: 10px 14px; }
    .q .qrow { display: flex; gap: 10px; align-items: center; font-weight: 700; }
    .q .num { width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .q .txt { flex: 1; }
    .hint { margin: 8px 0 0 40px; background: #fff; border-radius: 10px; padding: 4px 6px 4px 12px; }
    .hintbtn { margin: 8px 0 0 40px; border: 2px dashed var(--red); background: #fff; border-radius: 10px; padding: 4px 14px; color: var(--red); }
    .opts { display: grid; gap: 10px; margin-bottom: 12px; }
    .opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 3px solid var(--line); background: var(--yellow-soft); border-radius: 16px; padding: 10px 14px; min-height: 64px; font-size: 1.1em; }
    .opt:hover:not(:disabled) { border-color: var(--yellow); }
    .opt .ic { font-size: 1.6em; }
    .opt.ok { border-color: var(--green); background: var(--green-soft); }
    .opt.no { border-color: var(--red); background: var(--red-soft); }
    .fb { border-radius: 12px; padding: 8px 14px; margin: 0 0 12px; font-weight: 700; }
    .fb.ok { background: var(--green-soft); color: var(--green); } .fb.no { background: var(--red-soft); color: var(--red); }
    .note { color: var(--ink-soft); font-size: .9em; margin: 0 0 12px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .three div { border-radius: 14px; padding: 10px 14px; }
    .three h4 { margin: 0 0 4px; }
    .three p { margin: 0; }
    .b1 { background: var(--red-soft); } .b2 { background: var(--yellow-soft); } .b3 { background: var(--green-soft); }
    .practice { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
    .practice button:not(.say) { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 14px; min-height: 56px; }
    .practice .box { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--green); flex: none; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
    .practice .on { border-color: var(--green); background: var(--green-soft); }
    .practice .on .box { background: var(--green); }
    .twist { background: var(--yellow-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
    .rate { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .rate button { border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 6px 16px; min-height: 52px; }
    .rate button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); font-weight: 700; }

    /* 口訣卡 */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .kcard { background: var(--surface); border-radius: var(--radius); padding: 16px; border-top: 10px solid var(--green); break-inside: avoid; }
    .kcard .no { color: var(--ink-soft); font-size: .85em; }
    .kcard h3 { margin: 2px 0 10px; }
    .kcard p { margin: 10px 0 0; }

    @media (max-width: 640px) {
      .steps { grid-template-columns: repeat(5, 1fr); gap: 3px; }
      .steps button { font-size: .72em; min-height: 46px; }
      .steps span { display: none; }
      .three { grid-template-columns: 1fr; }
      .bub { max-width: 46%; }
    }
    @media print {
      .no-print, .top .tabs { display: none !important; }
      body { background: #fff; }
      .kcard { border: 2px solid #ccc; border-top: 10px solid var(--green); }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="lights" aria-hidden="true"><i style="background:#D2483C"></i><i style="background:#E0A21A"></i><i style="background:#2D8A57"></i></span>和喬治一起練習相處<button class="say" data-say="和喬治一起練習相處" aria-label="念出來">🔊</button></h1>
    <nav class="tabs" aria-label="選單">
      <button class="tab" data-view="list">情境列表</button>
      <button class="tab" data-view="cards">口訣卡</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
/* ================= 人物 =================
 * 每個情境的 cast 寫角色，畫面（frame）只寫「這一格有什麼改變」。
 * kind：kid 男生、girl 女生、teacher 老師、mom 媽媽、man 大人（男）
 * mood：happy 開心、neutral 平常、sad 難過、angry 生氣、surprised 驚訝、scared 害怕、worried 擔心、gross 覺得噁心
 * pose：down 手放下、raise 舉手、wave 打招呼、reach 伸手、point 指、nose 挖鼻孔、mouth 摀嘴笑、back 手藏背後、cross 手交叉、hips 手插腰
 * rot：身體傾斜角度（跌倒用）
 */
var LE = { name: '喬治', kind: 'kid', color: '#F08A3C', hair: '#3B2A20' };
function P(base, x, extra) { var o = {}; for (var k in base) o[k] = base[k]; o.x = x; for (k in extra || {}) o[k] = extra[k]; return o; }
var KIDS = {
  qing:  { name: '小晴', kind: 'girl', color: '#E77FA6', hair: '#5A3420' },
  ming:  { name: '阿明', kind: 'kid', color: '#5FAF72', hair: '#2A2A2A' },
  ru:    { name: '小如', kind: 'girl', color: '#9B8FD1', hair: '#3A2A1C', tails: 1 },
  wei:   { name: '大偉', kind: 'kid', color: '#4FA3C7', hair: '#4A2F1C' },
  tea:   { name: '老師', kind: 'teacher', color: '#5A7DB5', hair: '#2A2A2A' },
  mom:   { name: '媽媽', kind: 'mom', color: '#D9776B', hair: '#3A2A20' },
  clerk: { name: '店員', kind: 'man', color: '#6B8E5A', hair: '#2A2A2A', apron: 1 }
};

/* ================= 十三個情境 ================= */
var SCENES = [
{ id: 'hall', title: '走廊上有人擋路', short: '要去上廁所，前面有同學站著聊天。', bg: 'hall', label: '廁所',
  cast: { le: P(LE, 120), qing: P(KIDS.qing, 440), ming: P(KIDS.ming, 560) },
  wrong: [
    { cap: '下課了，喬治想去上廁所。', c: { qing: { mood: 'happy' }, ming: { mood: 'happy' } }, say: [['qing', '你看我的新卡片！']] },
    { c: { le: { x: 320 } }, think: [['le', '他們擋住我了，衝過去！']] },
    { c: { le: { x: 510 }, ming: { mood: 'angry', x: 600, rot: 10 }, qing: { mood: 'surprised' } }, fx: [['💥', 555, 290]], say: [['ming', '哎唷！你撞到我了！']] },
    { c: { le: { mood: 'angry', pose: 'point' }, ming: { rot: 0 } }, say: [['le', '是你自己站在這裡的！']], think: [['ming', '撞到人還不道歉…']] }
  ],
  questions: [
    { q: '喬治做了什麼，讓阿明不開心？', hint: '從兩個人中間衝過去，撞到人，還怪別人。' },
    { q: '阿明心裡在想什麼？', hint: '「好痛！他撞到我還不道歉，我好生氣。」' },
    { q: '走廊上有沒有別的路可以走？', hint: '有！旁邊還有空間，可以先說「借過」再走過去。' }
  ],
  choose: { q: '前面有同學擋住路，喬治可以怎麼做？', opts: [
    { ic: '🏃', t: '從中間衝過去', fb: '衝過去很容易撞到人喔，再想一想！', demo: [
      { c: { le: { x: 320 } }, think: [['le', '衝過去！']] },
      { c: { le: { x: 510 }, ming: { mood: 'angry', x: 600, rot: 10 }, qing: { mood: 'surprised' } }, fx: [['💥', 555, 290]], say: [['ming', '好痛！']], cap: '衝過去撞到人，同學很生氣。' } ] },
    { ic: '🙋', t: '停下來，說「借過」，從旁邊走過去', ok: 1, fb: '對了！停下來、說借過、從旁邊走，大家都安全。' },
    { ic: '😠', t: '大聲叫他們讓開', fb: '大聲叫別人走開，別人會不舒服，再想一想！', demo: [
      { c: { le: { x: 320, mood: 'angry', pose: 'hips' } }, say: [['le', '走開啦！擋路！']] },
      { c: { qing: { mood: 'sad' }, ming: { mood: 'angry' } }, think: [['qing', '他好兇喔…']], cap: '大聲叫人走開，同學會不舒服，以後不想跟你玩。' } ] }
  ] },
  right: [
    { cap: '下課了，喬治想去上廁所。', c: { qing: { mood: 'happy' }, ming: { mood: 'happy' } }, say: [['qing', '你看我的新卡片！']] },
    { c: { le: { x: 320 } }, think: [['le', '停！前面有人，看一看。']] },
    { c: { le: { pose: 'wave' } }, say: [['le', '請借過一下。']] },
    { c: { ming: { x: 620 } }, say: [['ming', '好，你先過。']] },
    { c: { le: { x: 720, mood: 'happy', pose: 'down' } }, say: [['le', '謝謝！']], cap: '喬治從旁邊走過去，誰都沒有撞到。' },
    { cap: '如果不小心撞到人呢？', c: { le: { x: 510, mood: 'neutral' }, ming: { x: 600, mood: 'surprised', rot: 10 } }, fx: [['💥', 555, 290]] },
    { c: { le: { mood: 'worried' }, ming: { mood: 'happy', rot: 0 } }, say: [['le', '對不起！你還好嗎？'], ['ming', '沒關係。']] }
  ],
  how: { chain: ['停', '看', '說借過', '從旁邊走'], note: '不小心撞到人，要說：「對不起，你還好嗎？」' },
  sum: { p: '從中間衝過去，撞到人還怪別人。', o: '阿明覺得很痛，也很生氣。', c: '停下來、說借過、從旁邊走；撞到人要道歉。' },
  practice: ['走到「同學」前面，先停下來', '看一看，旁邊有沒有路', '說：「請借過一下。」', '從旁邊走過去，說「謝謝」'],
  twist: { q: '如果同學沒聽到？', a: '再說一次，聲音大一點點，或輕輕拍他的肩膀。' }
},
{ id: 'call', title: '老師叫我的時候', short: '上課在玩鉛筆，老師叫我的名字。', bg: 'class', label: '數學課', desks: [440, 640],
  cast: { tea: P(KIDS.tea, 140), le: P(LE, 440), ru: P(KIDS.ru, 640) },
  wrong: [
    { cap: '上課了，喬治一直在轉鉛筆。', c: { le: { mood: 'happy' } }, props: [['✏️', 470, 285]], think: [['le', '轉轉轉～好好玩！']] },
    { props: [['✏️', 470, 285]], say: [['tea', '喬治，請把鉛筆放下。']], think: [['le', '再轉一下下就好…']] },
    { c: { tea: { mood: 'worried' }, ru: { mood: 'surprised' } }, props: [['✏️', 470, 285]], say: [['tea', '喬治，鉛筆放下，看黑板。']], think: [['ru', '老師在叫他耶…']] },
    { c: { tea: { mood: 'angry', pose: 'hips' }, le: { mood: 'surprised' } }, props: [['✏️', 470, 285]], say: [['tea', '喬治！']], cap: '老師叫了三次，越來越生氣了。' }
  ],
  questions: [
    { q: '老師叫了喬治幾次？老師的心情有什麼變化？', hint: '三次。老師從平靜，變成擔心，最後生氣了。' },
    { q: '旁邊的小如在想什麼？', hint: '「老師在叫他，他怎麼不理？」「上課一直被打斷。」' },
    { q: '喬治為什麼沒有回應？', hint: '可能太專心玩、沒聽到，或是不想停下來。' }
  ],
  choose: { q: '老師叫喬治把鉛筆放下，喬治可以怎麼做？', opts: [

    var p = f.ppl[b[0][0]], top = ADULT[p.kind] ? 400 - 232 : 400 - 208;
    var bottom = (450 - top) / 450 * 100 + 2 + k * 15, left = p.x / 800 * 100, right = p.x >= 400;
    var pos = right ? 'right:' + Math.max(1, 100 - left - 6) + '%;--tail:calc(100% - 46px)' : 'left:' + Math.max(1, left - 6) + '%';
    html += '<div class="bub ' + b[1] + '" style="bottom:' + bottom + '%;' + pos + '"><span class="who">' + esc(p.name) + (b[1] === 'think' ? ' 心裡想' : '') + '</span>' + esc(b[0][1]) + '</div>';
  });
  f.fx.forEach(function (x) { html += '<span class="fx" style="left:' + (x[1] / 800 * 100) + '%;top:' + (x[2] / 450 * 100) + '%">' + x[0] + '</span>'; });
  if (f.cap) html += '<div class="cap">' + esc(f.cap) + '</div>';
  if (state.stamp) html += '<div class="stamp"><span>' + state.stamp + '</span></div>';
  st.innerHTML = html;
}
function frameText(f) {
  var s = SCENES[state.sc], parts = [];
  if (f.cap) parts.push(f.cap);
  f.say.forEach(function (b) { parts.push(b[1]); });
  f.think.forEach(function (b) { parts.push(s.cast[b[0]].name + '心裡想：' + b[1]); });
  return parts.map(function (t) { return /[。！？…」]$/.test(t) ? t : t + '。'; }).join('');
}

function showFrames(list, badge, after) {
  stopAll(); state.stamp = null;
  state.frames = build(SCENES[state.sc].cast, list, SCENES[state.sc].props); state.fi = 0; state.badge = badge; state.after = after;
  drawFrame(badge); renderCtrl();
}
function renderCtrl() {
  var c = $('#ctrl'), last = state.fi >= state.frames.length - 1;
  c.innerHTML = '<button class="btn" id="prev"' + (state.fi === 0 ? ' disabled' : '') + '>◀ 上一格</button>' +
    '<button class="btn primary" id="next"' + (last ? ' disabled' : '') + '>下一格 ▶</button>' +
    '<span class="spacer"></span>' +
    (state.auto ? '<button class="btn" id="stop">■ 停止</button>' : '<button class="btn" id="auto">▶ 自動播放</button>') +
    '<button class="btn" id="read" title="再念一次">🔁 再念一次</button>';
  $('#prev').onclick = function () { stopAll(); state.fi--; state.stamp = null; drawFrame(state.badge); renderCtrl(); speakFrame(); };
  $('#next').onclick = function () { stopAll(); nextFrame(); speakFrame(); };
  if ($('#auto')) $('#auto').onclick = autoPlay;
  if ($('#stop')) $('#stop').onclick = function () { stopAll(); renderCtrl(); };
  $('#read').onclick = function () { stopAll(); speakFrame(); };
}
function nextFrame() {
  if (state.fi < state.frames.length - 1) { state.fi++; drawFrame(state.badge); renderCtrl(); }
  if (state.fi === state.frames.length - 1 && state.after) { var a = state.after; state.after = null; a(); }
}
function speakFrame(done) { speak(frameText(state.frames[state.fi]), done); }
/* 影片播完：錯誤版接著「停！想一想」、換個方式接著「我可以怎麼做」，自動念出來（老師要求） */
function afterVideo() {
  var from = state.phase, sc = state.sc, next = { wrong: 'stop', right: 'act' }[from];
  if (next) setTimeout(function () { if (!state.auto && state.phase === from && state.sc === sc && state.view === 'player') goPhase(next); }, 800);
}
function autoPlay() {
  stopAll(); state.fi = 0; state.stamp = null; drawFrame(state.badge);
  var run = { t: null }; state.auto = run; renderCtrl();
  (function step() {
    speakFrame(function () {
      if (state.auto !== run) return;
      run.t = setTimeout(function () {
        if (state.auto !== run) return;
        if (state.fi >= state.frames.length - 1) { state.auto = null; renderCtrl(); afterVideo(); return; }
        nextFrame(); step();
      }, 900);
    });
  })();
}

function goPhase(k, quiet) {
  stopAll(); state.phase = k; state.stamp = null; renderSteps();
  var s = SCENES[state.sc], p = $('#panel'), say = sayBtn;
  if (k === 'wrong' || k === 'stop') showFrames(s.wrong, ['喬治這樣做', 'red']);
  if (k === 'choose') { state.picked = null; showFrames(s.wrong.slice(0, 1), ['想一想', 'yellow']); }
  if (k === 'right' || k === 'act') showFrames(s.right, ['換個方式做', 'green'], k === 'right' ? function () { state.rightSeen = true; } : null);

  if (k === 'wrong') {
    p.className = 'panel red';
    p.innerHTML = '<h3><span class="dot" style="background:var(--red)"></span><span style="flex:1">先看一看，喬治怎麼做</span>' + say('先看一看，喬治怎麼做。看的時候，注意喬治做了什麼？別人的表情怎麼樣？') + '</h3>' +
      '<p class="lead">按「下一格」一格一格看，或按「自動播放」。看的時候，注意喬治做了什麼？別人的表情怎麼樣？</p>' +
      '<div class="row"><span class="spacer"></span><button class="btn red" id="go">看完了，停下來想 →</button></div>';
    $('#go').onclick = function () { goPhase('stop'); };
    autoPlay();
  } else if (k === 'stop') {
    state.fi = state.frames.length - 1; drawFrame(state.badge); renderCtrl();
    p.className = 'panel red';
    p.innerHTML = '<h3><span class="dot" style="background:var(--red)"></span><span style="flex:1">停！想一想</span>' + say('停！想一想') + '</h3><ol class="qs">' + s.questions.map(function (q, i) {
      return '<li class="q"><div class="qrow"><span class="num">' + (i + 1) + '</span><span class="txt">' + esc(q.q) + '</span>' + say(q.q) + '</div>' +
        (state.revealed[i] ? '<p class="hint"><span>💡 ' + esc(q.hint) + '</span>' + say(q.hint) + '</p>' : '<button class="hintbtn" data-i="' + i + '">看提示</button>') + '</li>';
    }).join('') + '</ol><div class="row"><span class="spacer"></span><button class="btn primary" id="go">我來選選看 →</button></div>';
    p.querySelectorAll('.hintbtn').forEach(function (b) { b.onclick = function () { var i = b.dataset.i; state.revealed[i] = true; goPhase('stop', true); speak(s.questions[i].hint); }; });
    if (!quiet) speak('停！想一想。');
    $('#go').onclick = function () { goPhase('choose'); };
  } else if (k === 'choose') { renderChoose(); speak(s.choose.q); }
  else if (k === 'right') {
    p.className = 'panel green';
    p.innerHTML = '<h3><span class="dot" style="background:var(--green)"></span><span style="flex:1">換個方式做做看</span>' + say('換個方式做做看。這次喬治怎麼做？別人的表情有什麼不一樣？') + '</h3><p class="lead">這次喬治怎麼做？別人的表情有什麼不一樣？</p>' +
      '<div class="row"><span class="spacer"></span><button class="btn go" id="go">看完了，換我練 →</button></div>';
    $('#go').onclick = function () { goPhase('act'); };
    autoPlay();
  } else if (k === 'act') {
    state.fi = state.frames.length - 1; drawFrame(state.badge); renderCtrl();
    renderAct();
    speak('我可以怎麼做：' + s.how.chain.join('，') + '。');
  }
}

function renderChoose() {
  var s = SCENES[state.sc], c = s.choose, p = $('#panel'), pk = state.picked;
  p.className = 'panel yellow';
  var fb = '';
  if (pk === null) fb = '<p class="note">先讓學生說說看，再按選項。選錯的話，畫面會演出「這樣做會發生什麼事」。每個選項旁邊的 🔊 可以念出選項。</p>';
  else if (c.opts[pk].ok) fb = '<p class="fb ok row"><span style="flex:1">⭐ ' + esc(c.opts[pk].fb) + '</span>' + sayBtn(c.opts[pk].fb) + '</p><div class="row"><span class="spacer"></span><button class="btn go" id="go">▶ 看喬治換個方式做</button></div>';
  else fb = '<p class="fb no row"><span style="flex:1">' + esc(c.opts[pk].fb) + '</span>' + sayBtn(c.opts[pk].fb) + '</p><div class="row"><span class="spacer"></span><button class="btn primary" id="again">再選一次</button></div>';
  p.innerHTML = '<h3><span class="dot" style="background:var(--yellow)"></span><span style="flex:1">' + esc(c.q) + '</span>' + sayBtn(c.q) + '</h3>' +
    '<div class="opts">' + c.opts.map(function (o, i) {
      return '<div class="opt-row"><button class="opt ' + (pk === i ? (o.ok ? 'ok' : 'no') : '') + '" data-i="' + i + '"><span class="ic">' + o.ic + '</span><span>' + esc(o.t) + '</span></button>' + sayBtn(o.t) + '</div>';
    }).join('') + '</div>' + fb;
  p.querySelectorAll('.opt').forEach(function (b) {
    b.onclick = function () {
      var i = +b.dataset.i, o = c.opts[i]; state.picked = i;
      if (o.ok) { showFrames(s.wrong.slice(0, 1), ['想一想', 'yellow']); state.stamp = '⭕'; drawFrame(state.badge); renderChoose(); speak(o.fb); }
      else { showFrames(o.demo, ['如果這樣做…', 'red']); renderChoose(); autoPlayThen(function () { state.stamp = '❌'; drawFrame(state.badge); speak(o.fb); }); }
    };
  });
  if ($('#go')) $('#go').onclick = function () { goPhase('right'); };
  if ($('#again')) $('#again').onclick = function () { state.picked = null; showFrames(s.wrong.slice(0, 1), ['想一想', 'yellow']); renderChoose(); };
}
function autoPlayThen(cb) {
  autoPlay();
  var run = state.auto;
  (function wait() { if (state.auto === run) setTimeout(wait, 300); else if (state.fi === state.frames.length - 1) cb(); })();
}

function renderAct() {
  var s = SCENES[state.sc], p = $('#panel'), r = state.rate[s.id] || 0;
  p.className = 'panel green';
  p.innerHTML = '<h3><span class="dot" style="background:var(--green)"></span><span style="flex:1">我可以怎麼做</span>' + sayBtn('我可以怎麼做：' + s.how.chain.join('，') + '。' + s.how.note) + '</h3>' + chain(s.how.chain, 'big') +
    '<p class="lead" style="margin-top:10px">' + esc(s.how.note) + '</p>' +
    '<div class="three">' + [['b1', '🔴', '發生什麼問題', s.sum.p], ['b2', '🟡', '別人心裡想什麼', s.sum.o], ['b3', '🟢', '我重新選擇', s.sum.c]].map(function (x) {
      return '<div class="' + x[0] + '"><h4><span>' + x[1] + ' ' + x[2] + '</span>' + sayBtn(x[2] + '：' + x[3]) + '</h4><p>' + esc(x[3]) + '</p></div>';
    }).join('') + '</div>' +
    '<h3 style="font-size:1.15em"><span style="flex:1">🎭 換我演：做到一步，就按一下</span>' + sayBtn('換我演：做到一步，就按一下') + '</h3><ol class="practice">' + s.practice.map(function (t, i) {
      return '<li><button class="' + (state.checks[i] ? 'on' : '') + '" data-i="' + i + '"><span class="box">' + (state.checks[i] ? '✓' : '') + '</span>' + (i + 1) + '. ' + esc(t) + '</button>' + sayBtn('第' + (i + 1) + '步，' + t) + '</li>';
    }).join('') + '</ol>' +
    '<div class="twist"><div><b>🤔 ' + esc(s.twist.q) + '</b><br>→ ' + esc(s.twist.a) + '</div>' + sayBtn(s.twist.q + s.twist.a) + '</div>' +
    '<h3 style="font-size:1.15em"><span style="flex:1">⭐ 我這次演得怎麼樣？</span>' + sayBtn('我這次演得怎麼樣？做到了、差一點，還是還要練？') + '</h3><div class="rate">' +
    [[3, '😀 做到了'], [2, '🙂 差一點'], [1, '😟 還要練']].map(function (x) { return '<button data-r="' + x[0] + '" aria-pressed="' + (r === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="again">再看一次喬治怎麼做</button><span class="spacer"></span>' +
    (state.sc < SCENES.length - 1 ? '<button class="btn go" id="nextsc">下一個情境 →</button>' : '<button class="btn go" id="cards">看全部口訣卡 →</button>') + '</div>';
  p.querySelectorAll('.practice button').forEach(function (b) {
    b.onclick = function () { var i = b.dataset.i; state.checks[i] = !state.checks[i]; if (state.checks[i]) speak(s.practice[i]); renderAct(); };
  });
  p.querySelectorAll('.rate button').forEach(function (b) {
    b.onclick = function () { state.rate[s.id] = +b.dataset.r; storeChecks(); renderAct(); speak(b.textContent.replace(/^\S+\s/, '')); };
  });
  $('#again').onclick = function () { goPhase('wrong'); };
  if ($('#nextsc')) $('#nextsc').onclick = function () { openScene(state.sc + 1); };
  if ($('#cards')) $('#cards').onclick = function () { stopAll(); state.view = 'cards'; render(); };
}

document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { stopAll(); state.view = b.dataset.view; render(); }; });
render();
</script>
</body>
</html>
